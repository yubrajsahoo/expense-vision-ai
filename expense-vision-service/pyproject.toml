[project]
name = "expense-vision-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "google-genai>=3.3.0",
    "opencv-python>=5.0.0.93",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pytesseract>=0.3.13",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.34",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.ruff]
# Set the maximum line length
line-length = 88
# Target Python version (adjust if using a newer version)
target-version = "py312"
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
]

[tool.ruff.lint]
# Enable Pyflakes (F), pycodestyle (E, W), and isort (I)
select = ["E", "F", "W", "I"]
# Ignore specific rules if needed (e.g., E501 for line length if you prefer to let the formatter handle it)
ignore = []

[tool.ruff.format]
# Enable auto-formatting (like Black)
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
# Default command line options (automatically run coverage report)
addopts = "-v --cov=src --cov-branch --cov-report=term-missing --cov-report=html --cov-fail-under=80"
# Directory where pytest should look for tests
testpaths = [
    "tests",
]
# Ensure the src directory is in the Python path
pythonpath = ["src"]

markers = [
    "integration: marks tests as integration tests (run with --integration)",
]

# Enable live console logging
log_cli = true
log_cli_level = "INFO"
# Optional: Make the log output cleaner and easier to read
log_cli_format = "%(asctime)s [%(levelname)s] %(filename)s:%(funcName)s() - %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"